services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: note
      POSTGRES_PASSWORD: note
      POSTGRES_DB: notes
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U note -d notes']
      interval: 5s
      retries: 5

  migrate:
    build:
      context: ./api
      target: prod
    command: bun run migrate
    restart: no
    env_file: ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://note:note@postgres:5432/notes

  api:
    build:
      context: ./api
      target: prod
    ports:
      - '3000:3000'
    env_file: ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://note:note@postgres:5432/notes

  ui:
    depends_on:
      - api

volumes:
  pg_data:
